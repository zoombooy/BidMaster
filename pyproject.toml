[project]
name = "bidmaster"
version = "0.1.0"
description = "智能标书 Agent（一期：招标文件解析 + 技术/商务评分标准结构化）"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
ocr = ["paddleocr>=2.7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bidmaster", "bidmaster.schemas", "bidmaster.ingestion", "bidmaster.parser",
            "bidmaster.structure", "bidmaster.chunking", "bidmaster.extraction",
            "bidmaster.scoring", "bidmaster.evidence", "bidmaster.orchestration",
            "bidmaster.storage", "bidmaster.llm", "bidmaster.api"]
